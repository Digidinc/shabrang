<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Image Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      background: #0D1A1A; /* Shabrang dark parchment */
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 80px;
    }

    /* Decorative border frame */
    .border-frame {
      position: absolute;
      inset: 30px;
      border: 2px solid #C9A227; /* Gold */
      pointer-events: none;
    }

    /* Corner decorations */
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 2px solid #D4A84B; /* Gold light */
    }

    .corner.top-left {
      top: 20px;
      left: 20px;
      border-right: none;
      border-bottom: none;
    }

    .corner.top-right {
      top: 20px;
      right: 20px;
      border-left: none;
      border-bottom: none;
    }

    .corner.bottom-left {
      bottom: 20px;
      left: 20px;
      border-right: none;
      border-top: none;
    }

    .corner.bottom-right {
      bottom: 20px;
      right: 20px;
      border-left: none;
      border-top: none;
    }

    /* Logo */
    .logo {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 80px;
      height: 80px;
    }

    .logo svg {
      width: 100%;
      height: 100%;
    }

    /* Content area */
    .content {
      max-width: 900px;
      text-align: center;
      z-index: 10;
      padding: 0 40px;
    }

    .title {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 64px;
      font-weight: 700;
      color: #F5E6C8; /* Shabrang ink (light) */
      line-height: 1.2;
      margin-bottom: 30px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 32px;
      font-weight: 300;
      color: #D4A84B; /* Gold light */
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    .category {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      color: #2D5A6B; /* Teal */
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 30px;
    }

    /* Decorative elements */
    .decorative-line {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A227, transparent);
      margin: 20px auto;
    }

    /* Pattern overlay (subtle) */
    .pattern {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        #F5E6C8 10px,
        #F5E6C8 11px
      );
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="og-card">
    <!-- Pattern overlay -->
    <div class="pattern"></div>

    <!-- Border frame -->
    <div class="border-frame"></div>

    <!-- Corner decorations -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- Logo -->
    <div class="logo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- The Attractor (Gold - Invariant) -->
        <circle cx="100" cy="100" r="40" fill="none" stroke="#C9A227" stroke-width="2"/>
        <circle cx="100" cy="100" r="25" fill="none" stroke="#D4A84B" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="10" fill="#C9A227"/>

        <!-- The Coherence Field (Teal - Flow) -->
        <path d="M100,20 A80,80 0 0,1 180,100" fill="none" stroke="#2D5A6B" stroke-width="2" stroke-dasharray="4 4"/>
        <path d="M100,180 A80,80 0 0,1 20,100" fill="none" stroke="#2D5A6B" stroke-width="2" stroke-dasharray="4 4"/>

        <path d="M20,100 A80,80 0 0,1 100,20" fill="none" stroke="#3D6A7B" stroke-width="1.5"/>
        <path d="M180,100 A80,80 0 0,1 100,180" fill="none" stroke="#3D6A7B" stroke-width="1.5"/>

        <!-- The Vector (Trajectory) -->
        <line x1="100" y1="100" x2="160" y2="40" stroke="#F5E6C8" stroke-width="1.5"/>
        <circle cx="160" cy="40" r="3" fill="#F5E6C8"/>
      </svg>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="tagline" id="tagline">Shabrang — The Liquid Fortress</div>
      <div class="decorative-line"></div>
      <h1 class="title" id="title">Post Title Goes Here</h1>
      <div class="category" id="category">μ-Stack</div>
    </div>
  </div>

  <script>
    // This script will be used to populate the template dynamically
    function setContent(title, tagline, category) {
      document.getElementById('title').textContent = title;
      if (tagline) {
        document.getElementById('tagline').textContent = tagline;
      }
      if (category) {
        document.getElementById('category').textContent = category;
      }
    }

    // Get data from URL parameters if available
    const params = new URLSearchParams(window.location.search);
    if (params.has('title')) {
      setContent(
        decodeURIComponent(params.get('title')),
        params.get('tagline') ? decodeURIComponent(params.get('tagline')) : 'Shabrang — The Liquid Fortress',
        params.get('category') ? decodeURIComponent(params.get('category')) : 'μ-Stack'
      );
    }
  </script>
</body>
</html>
