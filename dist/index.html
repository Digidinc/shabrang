<!DOCTYPE html>
<html lang="en" >

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Book</title>

    <!-- SEO -->
    <meta name="description" content="">
    <meta property="og:title" content="Untitled Book">
    <meta property="og:description" content="">
    <meta property="og:image" content="images/og-cover.png">
    <meta property="og:type" content="book">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/experience.css">

    <style>
        :root {
            --background: #F5E6C8;
            --text: #1A1A18;
            --accent1: #2D5A6B;
            --accent2: #8B3535;
            --gold: #C9A227;
        }

        .index-header {
            text-align: center;
            padding: 60px 0;
            border-bottom: 3px solid var(--gold);
            margin-bottom: 50px;
        }

        .book-logo-img {
            width: 120px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
            border: none !important;
        }

        .book-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0 0 10px 0;
            border: none;
        }

        .book-subtitle {
            font-size: 1.1em;
            color: var(--accent1);
            font-style: italic;
            margin: 0 0 20px 0;
        }

        .toc-section {
            margin-bottom: 50px;
        }

        .toc-section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent2);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--gold);
        }

        .chapter-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chapter-item {
            padding: 0;
            margin-bottom: 5px;
        }

        .chapter-item::before {
            display: none;
        }

        .chapter-link {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .chapter-link:hover {
            background: white;
            border-color: var(--gold);
            transform: translateX(5px);
        }

        .chapter-number {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent1);
            color: white;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .chapter-item.premium .chapter-number {
            background: var(--gold);
        }

        .chapter-title {
            flex-grow: 1;
            font-size: 1.05em;
            color: var(--text);
        }

        .chapter-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--gold);
            color: white;
        }

        .chapter-badge.free {
            background: var(--accent1);
        }

        .chapter-badge.premium {
            background: var(--accent2);
        }

        .index-footer {
            text-align: center;
            padding-top: 40px;
            border-top: 1px solid var(--background);
            color: #666;
            font-size: 14px;
        }

        .cta-section {
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            margin: 40px 0;
        }

        .cta-section h3 {
            color: white;
            margin-top: 0;
        }

        .cta-btn {
            display: inline-block;
            background: white;
            color: var(--accent1);
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            color: var(--accent1);
        }
    </style>

    <!-- PWA -->
    
    <link rel="manifest" href="manifest.json">
    
</head>

<body>
    <div class="container">

        <!-- Book Header -->
        <header class="index-header">
            <img src="images/shabrang_565.png" alt="Shabrang" class="book-logo-img">
            <h1 class="book-title">Untitled Book</h1>
            
        </header>

        <!-- Free Chapters -->
        <section class="toc-section">
            <h2 class="toc-section-title">Free Chapters</h2>
            <ul class="chapter-list">
                
            </ul>
        </section>

        <!-- Premium CTA -->
        

        <!-- Premium Chapters -->
        
        

        <!-- Footer -->
        <footer class="index-footer">
            <p>Untitled Book &copy; 2025 Anonymous</p>
            <p>Built with Shabrang Engine</p>
        </footer>

    </div>

    <script src="js/experience.js" defer></script>
</body>
</html>
